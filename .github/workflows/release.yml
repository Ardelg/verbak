name: release

# Compila Verbak para Windows, macOS (Intel y Apple Silicon) y Linux, y sube los
# instaladores a un Release en borrador. Se dispara al empujar una etiqueta vX.Y.Z
#   git tag v1.0.0 && git push origin v1.0.0
# También se puede lanzar a mano desde la pestaña Actions ("Run workflow").

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dependencias del sistema (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Verbak ${{ github.ref_name }}'
          releaseBody: |
            Descarga el instalador para tu sistema.

            - **Windows:** `Verbak_*_x64-setup.exe`. Si aparece el aviso azul de SmartScreen: Más información -> Ejecutar de todas formas.
            - **macOS:** `Verbak_*.dmg`. Clic derecho -> Abrir la primera vez, y activa Verbak en Ajustes del Sistema -> Privacidad y seguridad -> Accesibilidad.
            - **Linux:** `.AppImage` o `.deb`.

            Las claves de API no van dentro del instalador: se configuran al abrir la app.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
